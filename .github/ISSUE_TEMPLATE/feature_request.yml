name: ✨ Feature Request
description: Suggest an idea or new feature for Nawaetu
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Punya ide atau saran fitur baru untuk Nawaetu? Silakan sampaikan di bawah!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
      placeholder: I'm always frustrated when...
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature Description
      description: Describe the solution or feature you'd like to see implemented.
      placeholder: A clear and concise description of what you want to happen...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear description of any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context & Mockups
      description: Add any other context, screenshots, or mockups about the feature request.
    validations:
      required: false
