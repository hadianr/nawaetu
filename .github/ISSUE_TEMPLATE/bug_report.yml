name: 🐛 Bug Report
description: Create a report to help us improve Nawaetu
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih sudah melaporkan bug! Mohon isi detail di bawah ini agar kami dapat memproses dan memperbaiki bug dengan cepat.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the issue in detail...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce the issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: A clear description of what actually happened instead.
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Screen Recording
      description: Add screenshots or visual evidence to help explain your problem.
      placeholder: Drag & drop images here
    validations:
      required: false
  - type: dropdown
    id: environment
    attributes:
      label: Operating System / Platform
      options:
        - iOS / PWA (iPhone / iPad)
        - Android / PWA
        - macOS (Desktop Browser)
        - Windows (Desktop Browser)
        - Linux (Desktop Browser)
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser Name & Version
      placeholder: e.g., Chrome 122, Safari 17, Firefox 123
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (e.g. console logs, errors).
    validations:
      required: false
