version: 2
multi-ecosystem-groups:
  routine-dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: npm
    directory: /
    patterns:
      - '*'
    ignore:
      - dependency-name: typescript
        versions: [">= 7.0.0"]
    open-pull-requests-limit: 1
    multi-ecosystem-group: routine-dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - '*'
    open-pull-requests-limit: 1
    multi-ecosystem-group: routine-dependencies
