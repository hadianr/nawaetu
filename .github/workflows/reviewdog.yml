name: PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: reviewdog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  eslint-review:
    name: ESLint review comments
    if: ${{ !startsWith(github.head_ref, 'release/v') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --fund=false

      - name: Review ESLint findings
        uses: reviewdog/action-eslint@b6303df522851d0e9abaea654da0222037d97e75 # v1.36.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          eslint_flags: "."
          reviewdog_flags: "-filter-mode=diff_context"
          fail_level: error
